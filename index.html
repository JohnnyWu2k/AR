<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Repositorie Hub</title>
    <style>
        body {
            background-color: #202020;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            margin-top: 100px;
            font-size: 2.5em;
            animation: slideDown 1s ease-in-out;
        }
        .button-container {
            margin-top: 50px;
        }
        .button {
            display: block;
            width: 200px;
            margin: 15px auto;
            padding: 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 10px;
            border: 1px solid #555;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            animation: popUp 0.8s ease-in-out;
        }
        .button:hover {
            background-color: #555;
            transform: scale(1.1);
            box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
        }


        /* Keyframes for fade-in effect */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }


        /* Keyframes for slide-down effect */
        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }


        /* Keyframes for button pop-up effect */
        @keyframes popUp {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <h1>AR小物</h1>
    <div class="button-container">
        <a href="https://johnnywu2k.github.io/AR/goldenmrt" class="button">黃金捷運</a>
        <a href="https://johnnywu2k.github.io/AR/MrtPillow" class="button">捷運枕頭</a>
        <a href="https://johnnywu2k.github.io/AR/Taipei_MRT" class="button">台北捷運</a>
        <a href="https://johnnywu2k.github.io/AR/DestroyedMrt" class="button">捷運1</a>
        <a href="https://johnnywu2k.github.io/AR/InnovativeMrt" class="button">捷運2</a>
    </div>
</body>
</html>
